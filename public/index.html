<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerador de Roteiro Viral</title>
  <style>
    .lock-screen { position:fixed; inset:0; background:#0a0a0a; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
    .lock-box { background:#111; border:1px solid #1f1f1f; border-radius:20px; padding:2.5rem 2rem; width:100%; max-width:360px; text-align:center; }
    .lock-icon { font-size:36px; margin-bottom:16px; }
    .lock-title { font-size:22px; font-weight:700; margin-bottom:6px; }
    .lock-sub { font-size:14px; color:#555; margin-bottom:24px; }
    .lock-input { width:100%; padding:12px 14px; font-size:16px; border:1px solid #222; border-radius:10px; background:#0d0d0d; color:#fff; font-family:inherit; outline:none; text-align:center; letter-spacing:3px; box-sizing:border-box; transition:border-color 0.2s; }
    .lock-input:focus { border-color:#ff6b00; }
    .lock-btn { width:100%; margin-top:12px; padding:12px; font-size:15px; font-weight:600; cursor:pointer; border:none; border-radius:10px; background:linear-gradient(135deg,#ff6b00,#ff8c00); color:#fff; }
    .lock-error { color:#ff4444; font-size:13px; margin-top:10px; display:none; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; min-height: 100vh; padding: 2rem 1.5rem; }
    .badge { display: inline-flex; align-items: center; gap: 6px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 20px; padding: 4px 12px; font-size: 12px; color: #888; margin-bottom: 24px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff6b00; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }
    .accent { color: #ff6b00; }
    .sub { font-size: 14px; color: #555; margin-bottom: 32px; }
    .card { background: #111; border: 1px solid #1f1f1f; border-radius: 16px; padding: 1.5rem; }
    label { font-size: 12px; color: #555; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
    textarea { width: 100%; min-height: 90px; font-size: 15px; padding: 12px 14px; border: 1px solid #222; border-radius: 10px; background: #0d0d0d; color: #fff; resize: vertical; font-family: inherit; outline: none; transition: border-color 0.2s; }
    textarea:focus { border-color: #ff6b00; }
    .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
    select { flex: 1; min-width: 130px; font-size: 14px; padding: 10px 12px; border: 1px solid #222; border-radius: 10px; background: #0d0d0d; color: #fff; font-family: inherit; outline: none; }
    .btn { padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; border-radius: 10px; background: linear-gradient(135deg, #ff6b00, #ff8c00); color: #fff; white-space: nowrap; }
    .btn:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }
    .load-bar { height: 3px; background: #1a1a1a; border-radius: 2px; overflow: hidden; margin-top: 16px; }
    .load-inner { height: 100%; background: #ff6b00; border-radius: 2px; animation: grow 2s ease-in-out infinite alternate; }
    @keyframes grow { from { width: 15% } to { width: 92% } }
    .load-msg { font-size: 12px; color: #555; margin-top: 14px; margin-bottom: 6px; }
    .result { margin-top: 24px; display: none; }
    .time-header { background: #111; border: 1px solid #2a2a2a; border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .time-icon { width: 32px; height: 32px; background: #ff6b0022; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #ff6b00; font-weight: 700; }
    .step-card { border: 1px solid #1f1f1f; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; background: #0d0d0d; }
    .step-card.special { background: #0f0b06; border-left-color: #c8860a !important; }
    .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .step-num { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .step-label { font-size: 13px; font-weight: 600; color: #aaa; }
    .step-label.special { color: #c8860a; }
    .step-desc { font-size: 11px; color: #333; margin-left: auto; }
    .step-text { font-size: 15px; color: #e8e8e8; line-height: 1.7; }
    .gancho-badge { display: inline-flex; align-items: center; gap: 6px; background: #c8860a22; border: 1px solid #c8860a44; border-radius: 20px; padding: 4px 14px; margin-bottom: 10px; font-size: 13px; font-weight: 700; color: #c8860a; }
    .tipos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; margin-bottom: 12px; }
    .tipo-item { padding: 5px 8px; border-radius: 6px; font-size: 11px; text-align: center; background: #1a1a1a; color: #444; border: 1px solid #222; }
    .tipo-item.ativo { background: #c8860a33; color: #c8860a; border-color: #c8860a55; font-weight: 600; }
    .gancho-exp { font-size: 14px; color: #bbb; line-height: 1.7; border-top: 1px solid #1a1a1a; padding-top: 10px; }
    .gancho-tip { font-size: 12px; color: #444; margin-top: 8px; font-style: italic; }
    .copy-btn { width: 100%; margin-top: 14px; padding: 11px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid #2a2a2a; border-radius: 10px; background: transparent; color: #555; transition: all 0.2s; }
    .copy-btn:hover { border-color: #ff6b00; color: #ff6b00; background: #ff6b0015; }
    .error { color: #ff4444; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- TELA DE SENHA -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-box">
      <div class="lock-icon">🔐</div>
      <div class="lock-title">Roteiro <span class="accent">Viral</span></div>
      <div class="lock-sub">Digite a senha para acessar</div>
      <input class="lock-input" type="password" id="senhaInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')verificarSenha()" />
      <button class="lock-btn" onclick="verificarSenha()">Entrar</button>
      <div class="lock-error" id="lockError">Senha incorreta. Tente novamente.</div>
    </div>
  </div>

  <div class="badge"><div class="dot"></div> Instagram Reels · Negócios & Empreendedorismo</div>
  <h1>Roteiro <span class="accent">Viral</span></h1>
  <p class="sub">Jogue uma ideia, a IA pesquisa e monta seu roteiro com estrutura de tempo + gancho estratégico.</p>

  <div class="card">
    <label>Sua ideia ou tema</label>
    <textarea id="ideia" placeholder="Ex: Por que a maioria dos empreendedores quebra nos primeiros 2 anos..."></textarea>
    <div class="row">
      <select id="tom">
        <option value="direto e provocador">Direto e provocador</option>
        <option value="educativo e inspirador">Educativo e inspirador</option>
        <option value="storytelling pessoal">Storytelling pessoal</option>
        <option value="dados e fatos surpreendentes">Dados e fatos</option>
      </select>
      <select id="duracao" style="flex:0 0 80px;min-width:0">
        <option value="30 segundos">30s</option>
        <option value="60 segundos" selected>60s</option>
        <option value="90 segundos">90s</option>
      </select>
      <button class="btn" id="btn" onclick="gerar()">Gerar roteiro ↗</button>
    </div>
    <p class="error" id="error" style="display:none"></p>
    <div id="loading" style="display:none">
      <p class="load-msg" id="loadmsg">Pesquisando sobre o tema...</p>
      <div class="load-bar"><div class="load-inner"></div></div>
    </div>
  </div>

  <div class="result" id="result"></div>

  <script>
    // ======= DEFINA SUA SENHA AQUI =======
    const SENHA_CORRETA = "aventus2025";
    // =====================================

    function verificarSenha() {
      const input = document.getElementById("senhaInput").value;
      const erro = document.getElementById("lockError");
      if (input === SENHA_CORRETA) {
        document.getElementById("lockScreen").style.display = "none";
      } else {
        erro.style.display = "block";
        document.getElementById("senhaInput").value = "";
        document.getElementById("senhaInput").focus();
      }
    }

    const CORES = ["#ff6b00","#ff7a00","#ff8c00","#e65c00","#cc5200"];
    const TIPOS = ["Negativo","Contraintuitivo","Curiosidade","Polêmica","Pergunta: Você sabia que...","Autoridade","Storytelling","Identificação","Frases de Impacto","Urgência","Visual"];
    const STEPS = [
      { key:"ideia", label:"Ideia Central", num:"1", desc:"O que você quer comunicar" },
      { key:"gancho", label:"Gancho (0–3s)", num:"2", desc:"Para o scroll imediatamente" },
      { key:"tipo_gancho", label:"Tipo de Gancho", num:"★", desc:"Estratégia dos 3 primeiros segundos", special:true },
      { key:"desenvolvimento", label:"Desenvolvimento (4–30s)", num:"3", desc:"Entregue o presságio sem enrolação" },
      { key:"climax", label:"Clímax (30s–1min)", num:"4", desc:"O insight. A virada. A lição." },
      { key:"fechamento", label:"Fechamento + CTA (1–1:30min)", num:"5", desc:"Promessa + chamada para ação" },
    ];

    const msgs = ["Pesquisando sobre o tema...","Analisando tendências...","Estruturando o roteiro...","Escolhendo o melhor gancho..."];
    let ticker;

    async function gerar() {
      const ideia = document.getElementById("ideia").value.trim();
      if (!ideia) return;
      const tom = document.getElementById("tom").value;
      const duracao = document.getElementById("duracao").value;
      const btn = document.getElementById("btn");
      const err = document.getElementById("error");
      const loading = document.getElementById("loading");
      const result = document.getElementById("result");

      btn.disabled = true; btn.textContent = "Gerando...";
      err.style.display = "none"; loading.style.display = "block"; result.style.display = "none";
      let mi = 0;
      ticker = setInterval(() => { mi=(mi+1)%msgs.length; document.getElementById("loadmsg").textContent=msgs[mi]; }, 1800);

      try {
        const res = await fetch("/gerar-roteiro", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ideia, tom, duracao })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        renderResult(data);
      } catch(e) {
        err.textContent = "Erro ao gerar roteiro. Tente novamente.";
        err.style.display = "block";
      } finally {
        clearInterval(ticker);
        loading.style.display = "none";
        btn.disabled = false; btn.textContent = "Gerar roteiro ↗";
      }
    }

    function renderResult(data) {
      const result = document.getElementById("result");
      let html = `<div class="time-header"><div class="time-icon">⏱</div><div><div style="font-size:13px;font-weight:600;color:#ccc">Estrutura de tempo do Reel</div><div style="font-size:11px;color:#444">Gancho → Desenvolvimento → Clímax → Fechamento + CTA</div></div></div>`;

      STEPS.forEach((s, i) => {
        const cor = s.special ? "#c8860a" : CORES[i % CORES.length];
        html += `<div class="step-card${s.special?' special':''}" style="border-left:3px solid ${cor}">
          <div class="step-head">
            <div class="step-num" style="background:${cor}22;color:${cor}">${s.num}</div>
            <span class="step-label${s.special?' special':''}">${s.label}</span>
            <span class="step-desc">${s.desc}</span>
          </div>`;

        if (s.special) {
          const txt = data[s.key] || "";
          const partes = txt.split(/\s*[:\-–]\s*/);
          const tipo = partes[0] || txt;
          const exp = partes.slice(1).join(" ") || "";
          html += `<div class="gancho-badge">Tipo: ${tipo}</div>
            <div class="tipos-grid">${TIPOS.map((g,gi) => `<div class="tipo-item${tipo.toLowerCase().includes(g.toLowerCase().split(":")[0].trim())?' ativo':''}">${gi+1}. ${g}</div>`).join("")}</div>
            ${exp ? `<p class="gancho-exp">${exp}</p>` : ""}
            <p class="gancho-tip">Combine Visual + Textual + Sonoro para máxima retenção nos primeiros 3 segundos.</p>`;
        } else {
          html += `<p class="step-text">${data[s.key]}</p>`;
        }
        html += `</div>`;
      });

      html += `<button class="copy-btn" onclick="copiar()">Copiar roteiro completo</button>`;
      result.innerHTML = html;
      result.style.display = "block";
      window._roteiro = data;
    }

    function copiar() {
      if (!window._roteiro) return;
      const labels = { ideia:"IDEIA", gancho:"GANCHO", tipo_gancho:"TIPO DE GANCHO", desenvolvimento:"DESENVOLVIMENTO", climax:"CLÍMAX", fechamento:"FECHAMENTO + CTA" };
      const txt = STEPS.map(s => `${labels[s.key]}\n${window._roteiro[s.key]}`).join("\n\n");
      navigator.clipboard.writeText(txt).then(() => {
        const btn = document.querySelector(".copy-btn");
        btn.textContent = "✓ Copiado!"; btn.style.color="#ff6b00"; btn.style.borderColor="#ff6b00";
        setTimeout(() => { btn.textContent="Copiar roteiro completo"; btn.style.color=""; btn.style.borderColor=""; }, 2500);
      });
    }
  </script>
</body>
</html>
